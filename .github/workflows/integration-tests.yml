name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: 'all'
      harper_ref:
        description: 'HarperFast/harper ref to test against (branch, SHA, or tag). Empty = use pinned version.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '20'
          - '22'
          - '24'
      harper_ref:
        description: 'HarperFast/harper ref to test against (branch, SHA, or tag). Empty = use pinned version.'
        required: false
        type: string
        default: ''

jobs:
  generate-node-version-matrix:
    name: Generate Node Version Matrix
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-node-versions.outputs.node-versions }}

    steps:
      # Always check out THIS repo's code, even when invoked as a reusable
      # workflow. In a `workflow_call`, `github.repository` is the caller (e.g.
      # HarperFast/harper), so a default checkout would pull the caller's source.
      # `github.job_workflow_sha` is the pinned SHA of this reusable workflow
      # file; it is empty on direct runs, where we fall back to `github.sha`.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/nextjs
          ref: ${{ github.job_workflow_sha || github.sha }}

      - name: Set Node versions
        id: set-node-versions
        run: |
          INPUT="${{ inputs.node-version }}"
          if [ "$INPUT" == "all" ] || [ -z "$INPUT" ]; then
            echo "node-versions=[20, 22, 24]" >> $GITHUB_OUTPUT
          else
            echo "node-versions=[$INPUT]" >> $GITHUB_OUTPUT
          fi

  integration-tests:
    name: Integration Tests (Node ${{ matrix.node-version }})
    needs: [generate-node-version-matrix]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}

    steps:
      # See note in generate-node-version-matrix: force this repo's code so a
      # reusable-workflow caller's checkout context doesn't run the caller's
      # package.json scripts (build/install:fixtures/test:integration).
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/nextjs
          ref: ${{ github.job_workflow_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Checkout harper override
        if: ${{ inputs.harper_ref != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/harper
          ref: ${{ inputs.harper_ref }}
          path: harper-override

      - name: Build and install harper override
        if: ${{ inputs.harper_ref != '' }}
        run: |
          cd "$GITHUB_WORKSPACE/harper-override"
          npm ci
          npm run build
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          mv "$TARBALL" /tmp/harper-override.tgz
          cd "$GITHUB_WORKSPACE"
          npm install --save-dev /tmp/harper-override.tgz

      - name: Build
        run: npm run build

      - name: Install fixture dependencies
        run: npm run install:fixtures

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 15
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-test-logs
          FORCE_COLOR: '1'

      - name: Upload Harper logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harper-logs-node-${{ matrix.node-version }}
          path: /tmp/harper-test-logs/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces-node-${{ matrix.node-version }}
          path: integrationTests/test-results/
          retention-days: 7
