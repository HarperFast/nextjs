name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '20'
          - '22'
          - '24'

jobs:
  generate-node-version-matrix:
    name: Generate Node Version Matrix
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-node-versions.outputs.node-versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Node versions
        id: set-node-versions
        run: |
          if [ "${{ github.event.inputs.node-version }}" == "all" ] || [ -z "${{ github.event.inputs.node-version }}" ]; then
            echo "node-versions=[20, 22, 24]" >> $GITHUB_OUTPUT
          else
            echo "node-versions=[${{ github.event.inputs.node-version }}]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (Node ${{ matrix.node-version }})
    needs: generate-node-version-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        # This must be install so that it can update the package-lock if necessary for the various Node.js versions
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: |
            dist/
            package-lock.json
            package.json
          retention-days: 1

  integration-tests:
    name: Shard ${{ matrix.shard }}/3 (Node ${{ matrix.node-version }})
    needs: [generate-node-version-matrix, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-node-${{ matrix.node-version }}

      - name: Install dependencies
        # Build step updated package-lock so now this can use ci and be fast
        run: npm ci

      - name: Install fixture dependencies
        run: npm run install:fixtures

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npx playwright test --config integrationTests/playwright.config.ts --shard=${{ matrix.shard }}/3 --workers=1
        timeout-minutes: 5
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-test-logs
          FORCE_COLOR: '1'

      - name: Upload Harper logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harper-logs-shard-${{ matrix.shard }}-node-${{ matrix.node-version }}
          path: /tmp/harper-test-logs/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces-shard-${{ matrix.shard }}-node-${{ matrix.node-version }}
          path: integrationTests/test-results/
          retention-days: 7
